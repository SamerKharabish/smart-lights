version: 2
updates:
  # Monitor GitHub Actions for updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    labels:
      - "dependencies"
      - "automated"
    reviewers:
      - "SamerKharabish"
    pull-request-branch-name:
      separator: "/"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Monitor git submodules for updates
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
    labels:
      - "dependencies"
      - "automated"
    reviewers:
      - "SamerKharabish"
    pull-request-branch-name:
      separator: "/"
    commit-message:
      prefix: "build"
      include: "scope"
